<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="120" height="40" rx="8" fill="url(#gradient)"/>
  
  <!-- Tree icon -->
  <g transform="translate(8, 8)">
    <!-- Tree trunk -->
    <rect x="7" y="20" width="2" height="8" fill="#8B4513"/>
    
    <!-- Tree leaves -->
    <circle cx="8" cy="16" r="6" fill="#22c55e"/>
    <circle cx="6" cy="12" r="4" fill="#16a34a"/>
    <circle cx="10" cy="12" r="4" fill="#16a34a"/>
    <circle cx="8" cy="8" r="3" fill="#15803d"/>
  </g>
  
  <!-- Text -->
  <text x="35" y="16" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">المحيط الأخضر</text>
  <text x="35" y="28" font-family="Arial, sans-serif" font-size="8" fill="white" opacity="0.8">Green Ocean</text>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>