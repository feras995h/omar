<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار رفع الملفات</title>
    <style>
        body {
            font-family: 'Cairo', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }
        .upload-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .upload-button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        .upload-button:hover {
            background: #45a049;
        }
        .file-input {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            width: 100%;
        }
        .result {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .success {
            border-left: 4px solid #4CAF50;
        }
        .error {
            border-left: 4px solid #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 اختبار رفع الملفات</h1>
        
        <div class="upload-section">
            <h3>📁 رفع ملف واحد</h3>
            <input type="file" id="singleFile" class="file-input" accept="image/*,video/*,.pdf,.doc,.docx">
            <button class="upload-button" onclick="uploadSingleFile()">رفع ملف واحد</button>
            <div id="singleResult" class="result"></div>
        </div>

        <div class="upload-section">
            <h3>📁 رفع ملفات متعددة</h3>
            <input type="file" id="multipleFiles" class="file-input" accept="image/*,video/*,.pdf,.doc,.docx" multiple>
            <button class="upload-button" onclick="uploadMultipleFiles()">رفع ملفات متعددة</button>
            <div id="multipleResult" class="result"></div>
        </div>

        <div class="upload-section">
            <h3>📊 اختبار API</h3>
            <button class="upload-button" onclick="testAPI()">اختبار API</button>
            <button class="upload-button" onclick="testProjects()">اختبار المشاريع</button>
            <button class="upload-button" onclick="testStats()">اختبار الإحصائيات</button>
            <button class="upload-button" onclick="testFiles()">اختبار عرض الملفات</button>
            <div id="apiResult" class="result"></div>
        </div>
    </div>

    <script>
        // رفع ملف واحد
        async function uploadSingleFile() {
            const fileInput = document.getElementById('singleFile');
            const resultDiv = document.getElementById('singleResult');
            
            if (!fileInput.files[0]) {
                resultDiv.textContent = '❌ لم يتم اختيار أي ملف';
                resultDiv.className = 'result error';
                return;
            }
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            resultDiv.textContent = 'جاري رفع الملف...';
            
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.textContent = `✅ نجح رفع الملف!\n${JSON.stringify(data, null, 2)}`;
                    resultDiv.className = 'result success';
                } else {
                    resultDiv.textContent = `❌ فشل رفع الملف: ${data.message || 'خطأ غير معروف'}`;
                    resultDiv.className = 'result error';
                }
            } catch (error) {
                resultDiv.textContent = `❌ خطأ في رفع الملف: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }

        // رفع ملفات متعددة
        async function uploadMultipleFiles() {
            const fileInput = document.getElementById('multipleFiles');
            const resultDiv = document.getElementById('multipleResult');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                resultDiv.textContent = '❌ لم يتم اختيار أي ملفات';
                resultDiv.className = 'result error';
                return;
            }
            
            const formData = new FormData();
            for (let i = 0; i < fileInput.files.length; i++) {
                formData.append('files', fileInput.files[i]);
            }
            
            resultDiv.textContent = 'جاري رفع الملفات...';
            
            try {
                const response = await fetch('/api/upload-multiple', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.textContent = `✅ نجح رفع الملفات!\n${JSON.stringify(data, null, 2)}`;
                    resultDiv.className = 'result success';
                } else {
                    resultDiv.textContent = `❌ فشل رفع الملفات: ${data.message || 'خطأ غير معروف'}`;
                    resultDiv.className = 'result error';
                }
            } catch (error) {
                resultDiv.textContent = `❌ خطأ في رفع الملفات: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }

        // اختبار API
        async function testAPI() {
            const resultDiv = document.getElementById('apiResult');
            resultDiv.textContent = 'جاري اختبار API...';
            
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                resultDiv.textContent = `✅ API يعمل!\n${JSON.stringify(data, null, 2)}`;
                resultDiv.className = 'result success';
            } catch (error) {
                resultDiv.textContent = `❌ خطأ في API: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }

        // اختبار المشاريع
        async function testProjects() {
            const resultDiv = document.getElementById('apiResult');
            resultDiv.textContent = 'جاري اختبار المشاريع...';
            
            try {
                const response = await fetch('/api/projects');
                const data = await response.json();
                resultDiv.textContent = `✅ المشاريع تعمل!\n${JSON.stringify(data, null, 2)}`;
                resultDiv.className = 'result success';
            } catch (error) {
                resultDiv.textContent = `❌ خطأ في المشاريع: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }

        // اختبار الإحصائيات
        async function testStats() {
            const resultDiv = document.getElementById('apiResult');
            resultDiv.textContent = 'جاري اختبار الإحصائيات...';
            
            try {
                const response = await fetch('/api/dashboard/stats');
                const data = await response.json();
                resultDiv.textContent = `✅ الإحصائيات تعمل!\n${JSON.stringify(data, null, 2)}`;
                resultDiv.className = 'result success';
            } catch (error) {
                resultDiv.textContent = `❌ خطأ في الإحصائيات: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }

        // اختبار عرض الملفات
        async function testFiles() {
            const resultDiv = document.getElementById('apiResult');
            resultDiv.textContent = 'جاري اختبار عرض الملفات...';
            
            try {
                const response = await fetch('/api/files');
                const data = await response.json();
                resultDiv.textContent = `✅ عرض الملفات يعمل!\n${JSON.stringify(data, null, 2)}`;
                resultDiv.className = 'result success';
            } catch (error) {
                resultDiv.textContent = `❌ خطأ في عرض الملفات: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }
    </script>
</body>
</html>
